<h1>Crear Relación: Área de Conocimiento y Línea de Investigación</h1>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <ul style="color: red;">
    {% for category, message in messages %}
      <li><b>{{ message }}</b></li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<form action="{{ url_for('ac_linea.crear_ac_linea') }}" method="POST">
    
    <!-- SELECT DE LÍNEA DE INVESTIGACIÓN -->
    <label for="linea_investigacion">Línea de Investigación:</label>
    <select name="linea_investigacion" id="linea_investigacion" required>
        <option value="">-- Selecciona una Línea --</option>
        {% for linea in lineas %}
            <option value="{{ linea.id }}">{{ linea.nombre }}</option>
        {% endfor %}
    </select>
    <br><br>

    <!-- SELECT DE ÁREA DE CONOCIMIENTO -->
    <label for="area_conocimiento">Área de Conocimiento:</label>
    <select name="area_conocimiento" id="area_conocimiento" required>
        <option value="">-- Selecciona un Área --</option>
        {% for area in areas %}
            <option value="{{ area.id }}">{{ area.disciplina }} ({{ area.area }})</option>
        {% endfor %}
    </select>
    <br><br>

    <button type="submit">Guardar Relación</button>
    <a href="{{ url_for('ac_linea.listar_ac_linea') }}">Cancelar</a>
</form>
