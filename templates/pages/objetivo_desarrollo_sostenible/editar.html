<h1>Editar ODS</h1>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <ul style="color: red;">
    {% for category, message in messages %}
      <li><b>{{ message }}</b></li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<form action="{{ url_for('ods.editar_ods', id=ods.id) }}" method="POST">
    <div>
        <label for="id">ID:</label><br>
        <input type="text" id="id" value="{{ ods.id }}" disabled>
    </div>
    <br>
    <div>
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" value="{{ ods.nombre }}" required>
    </div>
    <br>
    <div>
        <label for="categoria">Categoría:</label><br>
        <input type="text" id="categoria" name="categoria" value="{{ ods.categoria }}" required>
    </div>
    <br>
    <button type="submit">Actualizar</button>
    <a href="{{ url_for('ods.listar_ods') }}">Cancelar</a>
</form>
